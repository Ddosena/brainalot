<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainalot · Focus</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="widget.css"><link rel="stylesheet" href="spotify-player.css"><script type="module" src="widget.js"></script><link rel="stylesheet" href="theme-tokens.css"></head>
<body class="focus-widget">
<div id="widget-tab" tabindex="0" aria-label="Плашка" title="Плашка" data-window-drag data-i18n-attr="aria-label,title"><svg class="widget-contour" aria-hidden="true"><rect class="widget-track" x="2.5" y="2.5" width="calc(100% - 5px)" height="calc(100% - 5px)" rx="21"/><rect id="widget-tab-progress" x="2.5" y="2.5" width="calc(100% - 5px)" height="calc(100% - 5px)" rx="21" pathLength="100"/></svg><output id="widget-tab-time">00:00</output></div>
<div class="widget-surface" data-window-drag><svg class="widget-contour" aria-hidden="true"><rect class="widget-track" x="2.5" y="2.5" width="calc(100% - 5px)" height="calc(100% - 5px)" rx="27"/><rect id="widget-progress" x="2.5" y="2.5" width="calc(100% - 5px)" height="calc(100% - 5px)" rx="27" pathLength="100"/></svg><section id="widget-spotify" data-no-drag aria-label="Spotify"></section><main class="widget-card" data-window-drag>
<div class="widget-clock"><output id="widget-time" aria-label="Таймер" data-i18n-attr="aria-label">00:00</output><button id="widget-mode-visible" aria-haspopup="dialog" aria-expanded="false"><span>Помодоро · 25 мин</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><span id="widget-time-label" hidden></span></div>
<section id="widget-fire"><div class="widget-task-row"><button id="widget-complete" role="checkbox" aria-checked="false" aria-label="Задача выполнена" title="Задача выполнена" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg></button><button id="widget-task" aria-haspopup="dialog" aria-expanded="false"><svg id="widget-critical-mark" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12.6 1.8c.5 3.3 3.8 5.2 5 8.6 1.7 4.6-1.5 9.8-5.6 9.8-3.7 0-6.6-2.9-6.6-6.6 0-2.5 1.3-4.4 2.8-5.8-.1 2 .7 3.5 2.1 4-.6-3.6.8-7 2.3-10z"/></svg><span id="widget-burning"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button></div><p id="widget-current"></p><div id="widget-ask" hidden><span id="widget-ask-title" data-i18n="Чем занимаешься?">Чем занимаешься?</span><button id="widget-ask-choice" aria-haspopup="dialog" aria-label="Чем занимаешься?" data-i18n-attr="aria-label" data-i18n="Выбрать или добавить">Выбрать или добавить</button></div></section>
<div class="widget-actions"><button id="widget-run" class="widget-primary" aria-label="Начать" title="Начать" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="widget-run-icon" d="m9 5 10 7-10 7z"/></svg></button><button id="widget-more" aria-label="Другие действия" title="Другие действия" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
</main></div>
<section id="widget-popup" role="dialog" data-no-drag hidden>
<div id="widget-picker" hidden><div class="widget-popup-head"><strong id="widget-picker-title" data-i18n="Перейти к задаче">Перейти к задаче</strong><button id="widget-close" aria-label="Закрыть список" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><form id="widget-find" class="widget-find" data-adding="false"><span class="widget-find-icon" aria-hidden="true"><svg class="widget-find-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg><svg class="widget-find-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><input id="widget-search" type="search" maxlength="500" autocomplete="off" aria-label="Поиск задачи" placeholder="Найти задачу…" data-i18n-attr="aria-label,placeholder"><button id="widget-new" type="button" aria-label="Новая задача" title="Новая задача" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="widget-new-icon" d="M4 20h4L19 9l-4-4L4 16zm9.5-13.5 4 4"/></svg></button><button id="widget-voice" type="button" aria-label="Надиктовать задачу" title="Надиктовать задачу" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3m-3 0h6"/></svg></button></form><p id="widget-voice-status" role="status" aria-live="polite" hidden></p><div id="widget-task-list"></div></div>
<div id="widget-modes" hidden><div class="widget-popup-head"><strong data-i18n="Режим учёта">Режим учёта</strong></div><button type="button" data-timer-mode="pomodoro" data-i18n="Помодоро">Помодоро</button><button type="button" data-timer-mode="stopwatch" data-i18n="Секундомер">Секундомер</button><button type="button" data-timer-mode="break" data-i18n="Перерыв">Перерыв</button><form id="widget-preset-form"><p data-i18n="Длительности для следующего запуска">Длительности для следующего запуска</p><label><span data-i18n="Помодоро, мин">Помодоро, мин</span><input id="widget-work-minutes" type="number" min="1" max="180" required value="25"></label><label><span data-i18n="Перерыв, мин">Перерыв, мин</span><input id="widget-break-minutes" type="number" min="1" max="180" required value="5"></label><button type="submit" data-i18n="Сохранить пресет">Сохранить пресет</button></form></div>
<div id="widget-music-settings" hidden></div>
<div id="widget-menu" hidden><button id="widget-done" data-i18n="Задача выполнена">Задача выполнена</button><button id="widget-stop" data-i18n="Закончить только учёт времени">Закончить только учёт времени</button><button id="widget-mode" data-i18n="Сменить режим">Сменить режим</button><hr><button id="widget-spotify-toggle" data-i18n="Скрыть Spotify">Скрыть Spotify</button><button id="widget-switch" data-i18n="Свернуть в закладку">Свернуть в закладку</button><button id="widget-open" data-i18n="Открыть полное окно">Открыть полное окно</button></div>
<div id="widget-notice"><p id="widget-error" role="alert" hidden></p><button id="widget-retry" hidden data-i18n="Проверить повтор">Проверить повтор</button></div>
</section></body></html>
