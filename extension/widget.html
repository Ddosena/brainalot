<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainalot · Focus</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="widget.css"><script type="module" src="widget.js"></script></head>
<body class="focus-widget">
<div id="widget-tab" tabindex="0" aria-label="Плашка" title="Плашка" data-window-drag data-i18n-attr="aria-label,title"><svg class="widget-contour" aria-hidden="true"><rect class="widget-track" x="1.5" y="1.5" width="calc(100% - 3px)" height="calc(100% - 3px)" rx="22"/><rect id="widget-tab-progress" x="1.5" y="1.5" width="calc(100% - 3px)" height="calc(100% - 3px)" rx="22" pathLength="100"/></svg><output id="widget-tab-time">00:00</output></div>
<main class="widget-card" data-window-drag>
<svg class="widget-contour" aria-hidden="true"><rect class="widget-track" x="1.5" y="1.5" width="calc(100% - 3px)" height="calc(100% - 3px)" rx="28"/><rect id="widget-progress" x="1.5" y="1.5" width="calc(100% - 3px)" height="calc(100% - 3px)" rx="28" pathLength="100"/></svg>
<div class="widget-clock"><output id="widget-time" aria-label="Таймер" data-i18n-attr="aria-label">00:00</output><span id="widget-time-label"></span></div>
<section id="widget-fire"><button id="widget-task" aria-haspopup="dialog" aria-expanded="false"><span id="widget-burning"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><p id="widget-current"></p><div id="widget-ask" hidden><span id="widget-ask-title" data-i18n="Чем занимаешься?">Чем занимаешься?</span><select id="widget-ask-choice" aria-label="Чем занимаешься?" data-i18n-attr="aria-label"></select></div></section>
<div class="widget-actions"><button id="widget-run" class="widget-primary" aria-label="Начать" title="Начать" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="widget-run-icon" d="m9 5 10 7-10 7z"/></svg></button><button id="widget-more" aria-label="Другие действия" title="Другие действия" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
</main>
<section id="widget-popup" role="dialog" data-no-drag hidden>
<div id="widget-picker" hidden><div class="widget-popup-head"><strong data-i18n="Перейти к задаче">Перейти к задаче</strong><button id="widget-close" aria-label="Закрыть список" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><input id="widget-search" type="search" aria-label="Поиск задачи" placeholder="Найти задачу…" data-i18n-attr="aria-label,placeholder"><div id="widget-task-list"></div><button id="widget-new" class="widget-new" data-i18n="Новая задача">Новая задача</button><form id="widget-new-form" hidden><input id="widget-new-title" maxlength="500" required aria-label="Название новой задачи" placeholder="Название задачи" data-i18n-attr="aria-label,placeholder"><button type="submit" data-i18n="Добавить">Добавить</button></form></div>
<div id="widget-menu" hidden><button id="widget-done" data-i18n="Задача выполнена">Задача выполнена</button><button id="widget-stop" data-i18n="Закончить только учёт времени">Закончить только учёт времени</button><button id="widget-mode" data-i18n="Сменить режим">Сменить режим</button><hr><button id="widget-switch" data-i18n="Свернуть в закладку">Свернуть в закладку</button><button id="widget-open" data-i18n="Открыть полное окно">Открыть полное окно</button></div>
<div id="widget-notice"><p id="widget-error" role="alert" hidden></p><button id="widget-retry" hidden data-i18n="Проверить повтор">Проверить повтор</button></div>
</section></body></html>
