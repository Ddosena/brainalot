<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainalot · Focus</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="widget.css"><script type="module" src="widget.js"></script></head>
<body class="focus-widget" data-window-drag>
<div id="widget-tab" role="button" tabindex="0" aria-label="Карточка" title="Карточка" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg><output id="widget-tab-time">00:00</output></div>
<main class="widget-card">
<section class="widget-timer" aria-label="Таймер" data-i18n-attr="aria-label"><div class="widget-clock"><output id="widget-time">00:00</output><button id="widget-run" aria-label="Начать" title="Начать" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="widget-run-icon" d="m9 5 10 7-10 7z"/></svg></button></div><div class="widget-time-actions"><button id="widget-mode" title="Сменить режим" aria-label="Сменить режим" data-i18n-attr="title,aria-label">Pomodoro</button><button id="widget-stop" title="Стоп" aria-label="Стоп" data-i18n-attr="title,aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button></div></section>
<section id="widget-fire" data-no-drag><select id="widget-fire-choice" aria-label="Горящее задание" data-i18n-attr="aria-label"></select><div id="widget-burning" class="is-critical"></div><p id="widget-current"></p></section>
<div class="widget-window-actions"><button id="widget-switch" title="Плашка" aria-label="Плашка" data-i18n-attr="title,aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="widget-open" title="Открыть" aria-label="Открыть" data-i18n-attr="title,aria-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button></div>
</main><p id="widget-error" role="alert" hidden></p><button id="widget-retry" hidden data-i18n="Проверить повтор">Проверить повтор</button></body></html>
