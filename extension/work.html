<!doctype html>
<html lang="ru" data-work-enabled="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d202b">
  <title>Brainalot · Work</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="work-period/styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="panel.html" aria-label="Brainalot">
      <svg viewBox="0 0 28 30" aria-hidden="true"><path d="m14 2 12 7v13l-12 7-12-7V9Z M2 9l12 7 12-7 M14 16v13"/></svg>
      <span>Brainalot <b>Work</b></span>
    </a>
    <nav class="work-navigation" aria-label="Режим Work" data-i18n-attr="aria-label">
      <a href="work.html" aria-current="page" data-i18n="План">План</a>
      <a href="work-day.html" data-i18n="День">День</a>
    </nav>
    <output id="sync-status" class="sync-status" aria-live="polite" data-i18n="Подключение…">Подключение…</output>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main id="planner" aria-busy="true"><div class="loading-state" data-i18n="Загружаем план…">Загружаем план…</div></main>
  <main id="work-paused" role="status">
    <h1 data-i18n="Work временно отключён">Work временно отключён</h1>
    <p data-i18n="Work временно отключён. Ваши задачи, доски и изображения сохранены.">Work временно отключён. Ваши задачи, доски и изображения сохранены.</p>
  </main>
  <noscript data-i18n="Для планирования нужен JavaScript.">Для планирования нужен JavaScript.</noscript>
  <script type="module" src="work-paused.js"></script>
</body>
</html>
