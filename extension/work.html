<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainalot · Work</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="work.css">
<link rel="stylesheet" href="time-ui.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-title">Brainalot · <span class="brand-mode">Work</span></div>
    <div class="brand-date" id="today-label"></div>
  </div>
  <div class="countdowns" id="countdowns"></div>
  <div class="top-actions">
    <div class="range-label" id="range-label"></div>
    <div class="nav">
      <button class="icon-btn" id="prev" title="Назад" aria-label="Назад" data-i18n-attr="title,aria-label"></button>
      <button id="go-today" data-i18n="Сегодня">Сегодня</button>
      <button class="icon-btn" id="next" title="Вперёд" aria-label="Вперёд" data-i18n-attr="title,aria-label"></button>
    </div>
    <div class="seg" id="range-seg">
      <button data-days="7" data-i18n="Неделя">Неделя</button>
      <button data-days="14" data-i18n="2 недели">2 недели</button>
    </div>
    <button class="inbox-toggle" id="inbox-toggle" type="button"></button>
    <button class="primary" id="add-task"></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" title="Ещё" aria-label="Ещё" data-i18n-attr="title,aria-label"></button>
      <div class="menu" id="menu" hidden>
        <button data-act="export" data-i18n="Сохранить копию данных">Сохранить копию данных</button>
        <button data-act="import" data-i18n="Загрузить копию…">Загрузить копию…</button>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<section class="inbox" id="inbox" hidden></section>
<section class="cal-wrap" id="cal-wrap"><div class="cal" id="calendar"></div></section>
<div class="splitter" id="splitter" title="Потяните, чтобы поменять высоту календаря" data-i18n-attr="title"></div>
<section class="board-wrap" id="board-wrap"></section>
<aside class="drawer" id="drawer" inert></aside>
<div class="toast" id="toast" hidden></div>
<script type="module" src="work-app.js"></script>
</body>
</html>
