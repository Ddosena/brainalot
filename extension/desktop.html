<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainalot</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="desktop.css"><script type="module" src="desktop.js"></script></head>
<body class="desktop-shell"><header class="desktop-nav" data-window-drag><div id="desktop-progress" aria-hidden="true" hidden><span></span></div><strong data-window-drag>Brainalot</strong><nav aria-label="Разделы" data-i18n-attr="aria-label"><button data-view="day" data-i18n="День">День</button><button data-view="library" data-i18n="Библиотека">Библиотека</button><button data-view="work" hidden>Work</button><button data-view="capture" data-i18n="Записать">Записать</button></nav>
<div class="desktop-window-actions"><button id="desktop-compact" aria-label="Свернуть" title="Свернуть" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><details class="desktop-menu"><summary aria-label="Меню" title="Меню" data-i18n-attr="aria-label,title"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div><button id="desktop-quit" data-i18n="Выход">Выход</button></div></details></div></header>
<iframe id="desktop-content" title="Brainalot" allow="microphone"></iframe><p id="desktop-error" role="alert" hidden></p>
<div class="desktop-resize n" data-resize="n"></div><div class="desktop-resize s" data-resize="s"></div><div class="desktop-resize e" data-resize="e"></div><div class="desktop-resize w" data-resize="w"></div><div class="desktop-resize ne" data-resize="ne"></div><div class="desktop-resize nw" data-resize="nw"></div><div class="desktop-resize se" data-resize="se"></div><div class="desktop-resize sw" data-resize="sw"></div>
</body></html>
