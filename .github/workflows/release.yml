name: release

# Work has its own tags, prereleases and update channel. Stable no-Work releases
# remain on codex/no-work (and main) with the original win channel.
on:
  push:
    tags: ["work-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-voice.txt
          python -m pip install -e . --no-deps
          python -m pytest
          node --test extension/tests/*.test.mjs
      - name: The tag must match the program version
        shell: python
        run: |
          import os, megamozg
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("work-v")
          assert tag == megamozg.__version__, (tag, megamozg.__version__)
      - name: Build tools
        run: |
          python -m pip install pyinstaller==6.22.3 velopack==1.2.158
          dotnet tool install -g vpk --version 1.2.158
      # Signing: add the certificate here (vpk pack --signParams or --azureTrustedSignFile) before selling.
      - name: Download the previous release (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir dist/releases --channel win-work --pre
      - name: Build the release
        run: python scripts/build_release.py
      - name: Publish
        run: vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir dist/releases --channel win-work --pre --publish --releaseName "Brainalot Work ${{ github.ref_name }}" --tag ${{ github.ref_name }}
      - name: Attach the Chrome Web Store zip and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist/releases/Brainalot-extension-*.zip dist/releases/SHA256SUMS.txt --clobber
